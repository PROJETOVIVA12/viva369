name: Backup de Avaliações Públicas

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Backup das avaliações
        run: |
          mkdir -p backups
          curl -X GET "https://odhsagokhlxbnahqpaiz.supabase.co/rest/v1/avaliacoes_publicas?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            > backups/avaliacoes_$(date +%Y%m%d).json
          
          git config user.name "GitHub Bot"
          git config user.email "bot@viva369.com"
          git add backups/
          git commit -m "Backup automático - $(date +%Y%m%d)" || echo "Sem alterações"
          git push
